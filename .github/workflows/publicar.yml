# O projeto no Cloudflare Pages é do tipo Direct Upload, e projeto Direct Upload
# não aceita conexão com Git depois de criado. Por isso a publicação passa por
# este workflow em vez da integração do painel — que, além do mais, deixaria a
# configuração de build fora do repositório (API-R16).

name: Publicar no Cloudflare Pages

on:
  push:
    branches: [main]
  # Permite republicar sem precisar de um commit novo.
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    # Toda action está presa ao commit, não à tag. Tag é ponteiro móvel: quem
    # controla o repositório da action pode reapontar `v4` para outro código, e
    # esse código roda no mesmo job que enxerga o segredo de publicação.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # API-R10 — configuração ausente não pode virar silêncio. Sem esta
      # conferência o build termina verde e publica uma página em branco: o
      # guard de `src/lib/supabase.ts` vira `throw` incondicional depois da
      # minificação e o React nunca monta. Falhar aqui troca "site branco em
      # produção, sem aviso" por "deploy vermelho, com o nome do que falta".
      #
      # Antes do `npm ci` de propósito: erro de configuração não precisa esperar
      # a instalação e o build para aparecer.
      # Também é aqui que os dois valores são resolvidos, uma vez só, e
      # repassados aos passos seguintes por GITHUB_ENV. Repetir a expressão no
      # passo de build convidaria as duas cópias a divergirem.
      - name: Conferir variáveis de publicação
        env:
          # `vars` é o lugar certo — `API-R01`: a chave é publicável, não
          # segredo, e mascarar no log sugeriria o contrário. Mas a mesma tela
          # do GitHub tem abas `Secrets` e `Variables` que criam coisas que não
          # se enxergam, e uma publicação não deveria depender de qual aba
          # alguém abriu. String vazia é falsa na expressão, então `vars` vence
          # quando existe e `secrets` só entra como rede.
          URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          CHAVE: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Só as chaves destes dois são impressas, nunca os valores.
          VARS_JSON: ${{ toJSON(vars) }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          faltando=
          [ -n "$URL" ] || faltando="$faltando VITE_SUPABASE_URL"
          [ -n "$CHAVE" ] || faltando="$faltando VITE_SUPABASE_PUBLISHABLE_KEY"
          if [ -n "$faltando" ]; then
            echo "::error::Falta, em vars e em secrets:$faltando"
            echo "Nomes que este job enxerga em vars:"
            echo "$VARS_JSON" | jq -r 'keys[]' | sed 's/^/  - /'
            echo "Nomes que este job enxerga em secrets:"
            echo "$SECRETS_JSON" | jq -r 'keys[]' | sed 's/^/  - /'
            echo "Não aparecendo em nenhuma das duas listas, foram criadas fora"
            echo "do alcance deste job: em Codespaces ou Dependabot (menus"
            echo "vizinhos, cada um com sua própria aba Variables), dentro de um"
            echo "Environment, ou noutro repositório."
            exit 1
          fi
          {
            echo "VITE_SUPABASE_URL=$URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$CHAVE"
          } >> "$GITHUB_ENV"

      # Lê a versão de .node-version — a mesma da máquina de desenvolvimento.
      # Node antigo quebra no `tsc -b` com erro de sintaxe difícil de ler.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Instalar dependências
        run: npm ci
        env:
          # O pacote `playwright` é devDependency (npm run shot / npm run smoke) e
          # o postinstall baixa ~400 MB de navegador que a publicação não usa.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # Portão mínimo: erro de tipo não deve chegar ao ar.
      - name: Verificar tipos
        run: npm run typecheck

      # As duas variáveis são embutidas no pacote aqui, e não no Cloudflare: o
      # projeto é Direct Upload, então o painel do Pages nunca vê este build e
      # as variáveis configuradas lá não têm efeito nenhum. Faltando, o guard de
      # `src/lib/supabase.ts` vira um `throw` incondicional depois da
      # minificação — a página publicada abre em branco (API-R10).
      #
      # Elas chegam por GITHUB_ENV, do passo de conferência: se o job chegou até
      # aqui, as duas existem.
      - name: Construir
        run: npm run build

      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=focus-ai --branch=main
